name: Build podcast episode
on:
  push:
    paths: ["episodes/**/script.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: podcast-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install edge-tts
      - run: python scripts/build_episode.py
        env:
          PAGES_BASE_URL: https://jacob-griffiths.github.io/Lit_Podcast
      - run: |
          touch .nojekyll
          git config user.name "podcast-bot"
          git config user.email "podcast-bot@users.noreply.github.com"
          git add -A episodes rss.xml .nojekyll
          git diff --cached --quiet || git commit -m "Publish episode audio + feed"
          git pull --rebase
          git push
